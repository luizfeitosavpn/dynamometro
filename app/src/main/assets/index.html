<title>Dinamômetro EV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#f4f6f9; --surface:#ffffff; --surface-2:#eef1f6; --elev:#ffffff;
    --line:#d9dee7; --line-strong:#c4cbd6;
    --ink:#141922; --muted:#5c6675; --faint:#8b94a3;
    --speed:#1c7ed6;     /* velocidade - azul */
    --rpm:#7048e8;       /* rotação - violeta */
    --good:#2f9e44; --warn:#e8a800; --crit:#e03131;
    --accent:#1c7ed6;
    --shadow:0 1px 2px rgba(20,25,34,.06), 0 8px 24px rgba(20,25,34,.06);
    --radius:14px;
    --mono:"Oxanium",ui-monospace,"SF Mono",Menlo,monospace;
    --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0e1116; --surface:#171b22; --surface-2:#12161c; --elev:#1e242d;
      --line:#262d38; --line-strong:#333c49;
      --ink:#e8ecf2; --muted:#98a2b3; --faint:#6b7683;
      --speed:#4dabf7; --rpm:#9775fa;
      --good:#51cf66; --warn:#ffd43b; --crit:#ff6b6b;
      --accent:#4dabf7;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1116; --surface:#171b22; --surface-2:#12161c; --elev:#1e242d;
    --line:#262d38; --line-strong:#333c49;
    --ink:#e8ecf2; --muted:#98a2b3; --faint:#6b7683;
    --speed:#4dabf7; --rpm:#9775fa;
    --good:#51cf66; --warn:#ffd43b; --crit:#ff6b6b;
    --accent:#4dabf7;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    margin:0;-webkit-text-size-adjust:100%;line-height:1.45}
  .wrap{max-width:920px;margin:0 auto;padding:16px;padding-block:16px 40px}

  /* Top bar */
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto}
  .logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--speed),var(--rpm));color:#fff;flex:none}
  .logo svg{width:20px;height:20px}
  .brand h1{font-family:var(--mono);font-weight:700;font-size:1.02rem;letter-spacing:.02em;margin:0}
  .brand small{display:block;color:var(--faint);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase}
  .status{display:inline-flex;align-items:center;gap:7px;font-size:.8rem;font-weight:600;
    padding:6px 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .status.on .dot{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
  .status.sim .dot{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 25%,transparent)}
  .status.err .dot{background:var(--crit)}
  .iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
    width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
  .iconbtn:hover{border-color:var(--line-strong)}
  .iconbtn svg{width:18px;height:18px}

  /* Config panel */
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
  .grid-cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .field input,.field select{font-family:var(--sans);font-size:.92rem;color:var(--ink);
    background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
  .field input:focus,.field select:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px;border-color:var(--accent)}
  .cfg-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .btn{appearance:none;font-family:var(--sans);font-weight:600;font-size:.9rem;cursor:pointer;
    border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
  .btn:hover{border-color:var(--line-strong)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .hint{font-size:.8rem;color:var(--muted);margin:10px 2px 0}
  .hint b{color:var(--ink)}

  /* Alarme de velocidade */
  .alarm-banner{display:flex;align-items:center;gap:10px;margin-bottom:16px;
    background:color-mix(in srgb,var(--crit) 14%,var(--surface));
    border:1px solid var(--crit);color:var(--crit);
    border-radius:var(--radius);padding:13px 16px;font-weight:600;font-size:.95rem;
    box-shadow:var(--shadow);animation:alarmPulse 1s ease-in-out infinite}
  .alarm-banner svg{width:22px;height:22px;flex:none}
  @keyframes alarmPulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--crit) 40%,transparent)}
    50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--crit) 0%,transparent)}}
  @media (prefers-reduced-motion:reduce){.alarm-banner{animation:none}}
  .gauge.over{border-color:var(--crit);box-shadow:0 0 0 1px var(--crit), var(--shadow)}

  /* Gauges */
  .gauges{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
  .gauge{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center}
  .gauge canvas{width:100%;max-width:520px;height:auto;aspect-ratio:1/.62}
  .gauge .glabel{font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}

  /* Chart */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 16px 16px;margin-bottom:16px}
  .card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .card-head h2{font-family:var(--mono);font-size:.98rem;font-weight:700;margin:0;letter-spacing:.02em}
  .card-head .spacer{margin-left:auto}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px}
  .seg button{appearance:none;border:0;background:transparent;color:var(--muted);font-family:var(--sans);
    font-weight:600;font-size:.82rem;padding:6px 13px;border-radius:7px;cursor:pointer}
  .seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  canvas.plot{width:100%;height:auto;aspect-ratio:16/6.2;display:block}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend i{width:12px;height:3px;border-radius:2px;display:inline-block}

  /* Recording */
  .recbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .recbar .count{font-family:var(--mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .rec-live{color:var(--crit);font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .rec-live .dot{background:var(--crit);animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.rec-live .dot{animation:none}}

  footer{color:var(--faint);font-size:.78rem;text-align:center;margin-top:8px;line-height:1.6}

  /* --- Responsivo / orientação --- */
  /* Retrato ou telas estreitas: mostradores grandes, um embaixo do outro */
  @media (max-width:640px){
    .gauges{grid-template-columns:1fr}
  }
  /* Celular na horizontal (pouca altura): dois mostradores lado a lado
     e paddings menores para aproveitar a tela */
  @media (orientation:landscape) and (max-height:600px){
    .wrap{max-width:100%;padding-block:12px 24px}
    .gauges{grid-template-columns:1fr 1fr;gap:12px}
    .gauge{padding:10px 8px 8px}
    .gauge canvas{aspect-ratio:1/.60}
    .topbar{margin-bottom:12px}
  }
</style>

<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 14a2 2 0 1 0 0-4"/><path d="M12 12 16 8"/>
          <path d="M4 18a9 9 0 1 1 16 0"/>
        </svg>
      </div>
      <div>
        <h1>Dinamômetro EV</h1>
        <small>Velocidade e rotação</small>
      </div>
    </div>
    <div id="status" class="status"><span class="dot"></span><span id="statusText">Desconectado</span></div>
    <button id="themeBtn" class="iconbtn" title="Alternar tema" aria-label="Alternar tema">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="cfgBtn" class="iconbtn" title="Configurações" aria-label="Configurações">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- Configuração -->
  <section id="cfgPanel" class="panel" hidden>
    <div class="grid-cfg">
      <div class="field">
        <label for="ip">IP do ESP32</label>
        <input id="ip" type="text" inputmode="decimal" placeholder="192.168.4.1" value="192.168.4.1">
      </div>
      <div class="field">
        <label for="port">Porta</label>
        <input id="port" type="number" inputmode="numeric" value="80">
      </div>
      <div class="field">
        <label for="mode">Modo de conexão</label>
        <select id="mode">
          <option value="http">HTTP (consulta periódica)</option>
          <option value="ws">WebSocket (streaming)</option>
        </select>
      </div>
      <div class="field">
        <label for="rate">Taxa de atualização (Hz)</label>
        <input id="rate" type="number" inputmode="numeric" value="10" min="1" max="50">
      </div>
      <div class="field">
        <label for="maxSpeed">Escala Velocidade (km/h)</label>
        <input id="maxSpeed" type="number" inputmode="numeric" value="80">
      </div>
      <div class="field">
        <label for="maxRpm">Escala Rotação (RPM)</label>
        <input id="maxRpm" type="number" inputmode="numeric" value="6000">
      </div>
      <div class="field">
        <label for="limSpeed">Limite de velocidade (km/h)</label>
        <input id="limSpeed" type="number" inputmode="numeric" value="32">
      </div>
    </div>
    <div class="cfg-actions">
      <button id="connectBtn" class="btn primary">Conectar</button>
      <button id="simBtn" class="btn">Simular (sem hardware)</button>
      <button id="disconnectBtn" class="btn ghost" disabled>Desconectar</button>
    </div>
    <p class="hint" id="cfgHint"></p>
  </section>

  <!-- Alarme de velocidade -->
  <div id="alarm" class="alarm-banner" role="alert" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
    <span id="alarmText">Equipamento acima da velocidade permitida</span>
  </div>

  <!-- Gauges -->
  <div class="gauges">
    <div class="gauge"><canvas id="gSpeed" width="480" height="307"></canvas><div class="glabel">Velocidade</div></div>
    <div class="gauge"><canvas id="gRpm" width="480" height="307"></canvas><div class="glabel">Rotação</div></div>
  </div>

  <!-- Gráfico ao vivo -->
  <div class="card">
    <div class="card-head">
      <h2>Ao vivo</h2>
      <div class="spacer"></div>
      <div class="seg" id="liveSeg" role="tablist" aria-label="Métrica do gráfico">
        <button data-m="speed" class="active">Velocidade</button>
        <button data-m="rpm">Rotação</button>
      </div>
    </div>
    <canvas id="liveChart" class="plot" width="1040" height="404"></canvas>
    <div class="legend"><span><i id="liveSw" style="background:var(--speed)"></i><span id="liveName">Velocidade (km/h)</span></span><span style="color:var(--faint)">janela de 30 s</span></div>
  </div>

  <!-- Gravação -->
  <div class="card">
    <div class="card-head"><h2>Gravação da sessão</h2></div>
    <div class="recbar">
      <button id="recBtn" class="btn primary">● Gravar</button>
      <button id="clearBtn" class="btn ghost">Limpar</button>
      <button id="csvBtn" class="btn" disabled>Exportar CSV</button>
      <span class="count" id="recCount">0 amostras</span>
      <span class="rec-live" id="recLive" hidden><span class="dot"></span>gravando</span>
    </div>
  </div>

  <footer>
    Velocidade e rotação em tempo real · dados via Wi-Fi do ESP32<br>
    <span id="srcNote"></span>
  </footer>
</div>

<script>
"use strict";
(function(){
  const $ = s => document.querySelector(s);
  const store = {
    get(k,d){ try{ const v=localStorage.getItem("dyno_"+k); return v===null?d:v; }catch(e){ return d; } },
    set(k,v){ try{ localStorage.setItem("dyno_"+k, v); }catch(e){} }
  };

  // ---- Theme ----
  const rootEl = document.documentElement;
  (function initTheme(){ const s=store.get("theme",null); if(s) rootEl.setAttribute("data-theme",s); })();
  $("#themeBtn").addEventListener("click", ()=>{
    const cur = rootEl.getAttribute("data-theme")
      || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark":"light");
    const next = cur==="dark" ? "light":"dark";
    rootEl.setAttribute("data-theme", next); store.set("theme", next); drawAll();
  });

  // ---- Config ----
  const cfgFields = ["ip","port","mode","rate","maxSpeed","maxRpm","limSpeed"];
  cfgFields.forEach(id=>{ const el=$("#"+id); const s=store.get(id,null); if(s!==null) el.value=s;
    el.addEventListener("change", ()=>store.set(id, el.value)); });
  const cfg = ()=>({
    ip:$("#ip").value.trim(), port:+$("#port").value||80, mode:$("#mode").value,
    rate:Math.min(50,Math.max(1,+$("#rate").value||10)),
    maxSpeed:+$("#maxSpeed").value||80, maxRpm:+$("#maxRpm").value||6000,
    limSpeed:+$("#limSpeed").value||32
  });
  $("#cfgBtn").addEventListener("click", ()=>{ const p=$("#cfgPanel"); p.hidden=!p.hidden; });

  // ---- State ----
  const S = { rpm:0, speed:0 };
  const live = [];               // {t, speed, rpm}
  const LIVE_WINDOW = 30000;
  const rec = [];
  let recording = false;

  // ---- Connection ----
  let conn = null;
  let mode = "idle";
  function setStatus(kind, text){ $("#status").className="status"+(kind?(" "+kind):""); $("#statusText").textContent=text; }

  function ingest(obj){
    const num = v => (typeof v==="number"&&isFinite(v))?v:(parseFloat(v)||0);
    S.rpm   = num(obj.rpm ?? obj.RPM ?? obj.rotacao);
    S.speed = num(obj.speed_kmh ?? obj.speed ?? obj.velocidade ?? obj.kmh);
    const t = Date.now();
    live.push({t, speed:S.speed, rpm:S.rpm});
    while(live.length && t-live[0].t > LIVE_WINDOW) live.shift();
    if(recording) rec.push({t, rpm:S.rpm, speed:S.speed});
    updateReadouts();
  }

  async function connectHttp(){
    const c=cfg(); const url=`http://${c.ip}:${c.port}/data`;
    const interval = 1000/c.rate; let stopped=false, fails=0;
    setStatus("", "Conectando…");
    async function poll(){
      if(stopped) return;
      const t0=performance.now();
      try{
        const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), Math.max(800,interval*3));
        const r=await fetch(url,{signal:ctl.signal,cache:"no-store"}); clearTimeout(to);
        if(!r.ok) throw new Error("HTTP "+r.status);
        ingest(await r.json());
        if(mode!=="http"){ mode="http"; setStatus("on","Conectado · HTTP"); }
        fails=0;
      }catch(e){
        fails++;
        if(fails===1) setStatus("err","Sem resposta… tentando");
        if(fails>=8){ setStatus("err","Falha na conexão"); showConnError(e); }
      }
      const el=performance.now()-t0;
      if(!stopped) setTimeout(poll, Math.max(0, interval-el));
    }
    poll();
    return { stop(){ stopped=true; } };
  }

  function connectWs(){
    const c=cfg(); const url=`ws://${c.ip}:${c.port}/ws`;
    setStatus("","Conectando…");
    let ws, stopped=false, retry=null;
    function open(){
      try{ ws=new WebSocket(url); }catch(e){ setStatus("err","URL inválida"); return; }
      ws.onopen=()=>{ mode="ws"; setStatus("on","Conectado · WebSocket"); };
      ws.onmessage=(ev)=>{ try{ ingest(JSON.parse(ev.data)); }catch(e){} };
      ws.onerror=()=>{ setStatus("err","Erro no WebSocket"); showConnError(new Error("ws error")); };
      ws.onclose=()=>{ if(!stopped){ setStatus("err","Reconectando…"); retry=setTimeout(open,1500); } };
    }
    open();
    return { stop(){ stopped=true; clearTimeout(retry); if(ws) try{ws.close();}catch(e){} } };
  }

  function showConnError(){
    const https = location.protocol==="https:";
    let msg = `Não consegui falar com o ESP32 em <b>${cfg().ip}:${cfg().port}</b>. `;
    if(https) msg += "Esta página está em <b>HTTPS</b> e o ESP32 usa HTTP — o navegador bloqueia essa mistura. Use o app (APK), abra o dashboard servido pelo ESP32, ou clique em <b>Simular</b> para testar a interface.";
    else msg += "Confira se o celular está na mesma rede/Wi-Fi do ESP32 e se o IP está certo.";
    $("#cfgHint").innerHTML=msg; $("#cfgPanel").hidden=false;
  }

  // ---- Simulator ----
  function connectSim(){
    mode="sim"; setStatus("sim","Modo simulação"); $("#cfgPanel").hidden=true;
    const c=cfg(); let stopped=false; let phase=0;
    const iv=setInterval(()=>{
      if(stopped) return;
      phase+=0.025;
      const throttle = (Math.sin(phase)*0.5+0.5);
      const rpm = Math.max(0, throttle*c.maxRpm*0.85 + (Math.random()*30-15));
      const speed = Math.max(0, throttle*c.maxSpeed*0.78 + (Math.random()*1.0-0.5));
      ingest({rpm, speed_kmh:speed});
    }, 1000/Math.min(20,c.rate));
    return { stop(){ stopped=true; clearInterval(iv); } };
  }

  function disconnect(){
    if(conn){ conn.stop(); conn=null; }
    mode="idle"; setStatus("","Desconectado");
    $("#disconnectBtn").disabled=true; $("#connectBtn").disabled=false; $("#simBtn").disabled=false;
  }
  function afterConnect(){ $("#disconnectBtn").disabled=false; $("#connectBtn").disabled=true; $("#simBtn").disabled=true; }

  $("#connectBtn").addEventListener("click", ()=>{ disconnect();
    conn = cfg().mode==="ws" ? connectWs() : connectHttp(); afterConnect(); });
  $("#simBtn").addEventListener("click", ()=>{ disconnect(); conn=connectSim(); afterConnect(); });
  $("#disconnectBtn").addEventListener("click", disconnect);

  // ---- Recording ----
  $("#recBtn").addEventListener("click", ()=>{
    recording=!recording;
    $("#recBtn").textContent = recording ? "■ Parar" : "● Gravar";
    $("#recBtn").classList.toggle("primary", !recording);
    $("#recLive").hidden = !recording;
  });
  $("#clearBtn").addEventListener("click", ()=>{ rec.length=0;
    $("#recCount").textContent="0 amostras"; $("#csvBtn").disabled=true; updateReadouts(); });
  $("#csvBtn").addEventListener("click", exportCsv);

  function exportCsv(){
    if(!rec.length) return;
    const lines=["timestamp_ms,rpm,speed_kmh"];
    for(const r of rec) lines.push([r.t, Math.round(r.rpm*100)/100, Math.round(r.speed*100)/100].join(","));
    const blob=new Blob([lines.join("\n")],{type:"text/csv"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
    a.download="dinamometro_"+new Date().toISOString().slice(0,19).replace(/[:T]/g,"-")+".csv";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  }

  // ---- Readouts ----
  const fmt = (x,d=0)=> (x||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
  function updateReadouts(){
    $("#recCount").textContent=rec.length+" amostra"+(rec.length===1?"":"s");
    $("#csvBtn").disabled = rec.length===0;
  }

  // ---- Drawing ----
  const css = v => getComputedStyle(document.body).getPropertyValue(v).trim();
  function prep(canvas){
    const dpr=Math.min(2,window.devicePixelRatio||1);
    const r=canvas.getBoundingClientRect();
    const w=Math.max(1,Math.round(r.width)), h=Math.max(1,Math.round(r.height));
    if(canvas._w!==w||canvas._h!==h||canvas._dpr!==dpr){ canvas.width=w*dpr; canvas.height=h*dpr; canvas._w=w; canvas._h=h; canvas._dpr=dpr; }
    const ctx=canvas.getContext("2d"); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,w,h);
    return {ctx,w,h};
  }

  function gauge(canvas, value, max, unit, color){
    const {ctx,w,h}=prep(canvas);
    const cx=w/2, cy=h*0.94, R=Math.min(w*0.44,h*0.90);
    const a0=Math.PI*0.82, a1=Math.PI*2.18;
    const v=Math.max(0,Math.min(1, max? value/max:0));
    ctx.lineCap="round";
    ctx.lineWidth=Math.max(9,R*0.14);
    ctx.strokeStyle=css("--surface-2"); ctx.beginPath(); ctx.arc(cx,cy,R,a0,a1); ctx.stroke();
    ctx.strokeStyle=css("--line-strong"); ctx.lineWidth=1.5;
    for(let i=0;i<=10;i++){ const a=a0+(a1-a0)*i/10; const r1=R*0.85,r2=R*0.98;
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1); ctx.lineTo(cx+Math.cos(a)*r2,cy+Math.sin(a)*r2); ctx.stroke(); }
    ctx.strokeStyle=color; ctx.lineWidth=Math.max(9,R*0.14);
    ctx.beginPath(); ctx.arc(cx,cy,R,a0,a0+(a1-a0)*v); ctx.stroke();
    ctx.fillStyle=color; ctx.beginPath(); ctx.arc(cx,cy,R*0.055,0,7); ctx.fill();
    ctx.fillStyle=css("--ink"); ctx.textAlign="center";
    ctx.font=`700 ${Math.round(R*0.36)}px "Oxanium",monospace`;
    ctx.fillText(fmt(value), cx, cy-R*0.17);
    ctx.fillStyle=css("--muted"); ctx.font=`600 ${Math.round(R*0.12)}px "Inter",sans-serif`;
    ctx.fillText(unit, cx, cy-R*0.17+Math.round(R*0.31));
    ctx.fillStyle=css("--faint"); ctx.font=`600 ${Math.round(R*0.10)}px "Inter",sans-serif`;
    ctx.textAlign="left"; ctx.fillText("0", cx+Math.cos(a0)*R*0.68, cy+Math.sin(a0)*R*0.68+4);
    ctx.textAlign="right"; ctx.fillText(fmt(max), cx+Math.cos(a1)*R*0.68, cy+Math.sin(a1)*R*0.68+4);
  }

  const liveMetrics = {
    speed:{name:"Velocidade (km/h)", key:"speed", color:"--speed", max:()=>cfg().maxSpeed},
    rpm:{name:"Rotação (RPM)", key:"rpm", color:"--rpm", max:()=>cfg().maxRpm}
  };
  let liveMetric="speed";
  $("#liveSeg").addEventListener("click", e=>{
    const b=e.target.closest("button"); if(!b) return;
    liveMetric=b.dataset.m;
    [...$("#liveSeg").children].forEach(x=>x.classList.toggle("active",x===b));
    const m=liveMetrics[liveMetric];
    $("#liveName").textContent=m.name; $("#liveSw").style.background=css(m.color);
    drawLive();
  });

  function drawLive(){
    const canvas=$("#liveChart"); const {ctx,w,h}=prep(canvas);
    const m=liveMetrics[liveMetric]; const col=css(m.color);
    const padL=48,padR=12,padT=12,padB=22;
    const gx0=padL,gx1=w-padR,gy0=padT,gy1=h-padB;
    const yMax=niceMax(Math.max(m.max()*0.15, ...live.map(d=>d[m.key]||0)));
    ctx.font=`500 11px "Inter",sans-serif`; ctx.textBaseline="middle";
    ctx.strokeStyle=css("--line"); ctx.fillStyle=css("--faint"); ctx.lineWidth=1;
    for(let i=0;i<=4;i++){ const y=gy1-(gy1-gy0)*i/4; const val=yMax*i/4;
      ctx.beginPath(); ctx.moveTo(gx0,y); ctx.lineTo(gx1,y); ctx.stroke();
      ctx.textAlign="right"; ctx.fillText(fmt(val, yMax<10?1:0), gx0-6, y); }
    if(live.length<2){ ctx.fillStyle=css("--faint"); ctx.textAlign="center";
      ctx.fillText("aguardando dados…", (gx0+gx1)/2,(gy0+gy1)/2); return; }
    const t1=live[live.length-1].t, t0=t1-LIVE_WINDOW;
    const X=t=>gx0+(gx1-gx0)*(t-t0)/LIVE_WINDOW;
    const Y=vv=>gy1-(gy1-gy0)*Math.max(0,Math.min(1,vv/yMax));
    ctx.beginPath(); ctx.moveTo(X(live[0].t),gy1);
    for(const d of live) ctx.lineTo(X(d.t),Y(d[m.key]||0));
    ctx.lineTo(X(live[live.length-1].t),gy1); ctx.closePath();
    const grad=ctx.createLinearGradient(0,gy0,0,gy1);
    grad.addColorStop(0, hexA(col,0.28)); grad.addColorStop(1, hexA(col,0.02));
    ctx.fillStyle=grad; ctx.fill();
    ctx.beginPath(); ctx.lineWidth=2; ctx.strokeStyle=col; ctx.lineJoin="round";
    live.forEach((d,i)=>{ const x=X(d.t),y=Y(d[m.key]||0); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
    ctx.stroke();
    const last=live[live.length-1];
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(X(last.t),Y(last[m.key]||0),3.5,0,7); ctx.fill();
    ctx.fillStyle=css("--faint"); ctx.textAlign="center"; ctx.textBaseline="alphabetic";
    ctx.fillText("-30 s", gx0+16, h-6); ctx.fillText("agora", gx1-16, h-6);
  }

  function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v)));
    const n=v/p; const s=n<=1?1:n<=2?2:n<=5?5:10; return s*p; }
  function hexA(c, a){
    if(c.startsWith("#")){ if(c.length===4) c="#"+[...c.slice(1)].map(x=>x+x).join("");
      const r=parseInt(c.slice(1,3),16),g=parseInt(c.slice(3,5),16),b=parseInt(c.slice(5,7),16);
      return `rgba(${r},${g},${b},${a})`; }
    return c;
  }

  function drawGauges(){
    const c=cfg();
    const over = S.speed >= c.limSpeed;
    gauge($("#gSpeed"), S.speed, c.maxSpeed, "km/h", over ? css("--crit") : css("--speed"));
    gauge($("#gRpm"), S.rpm, c.maxRpm, "rpm", css("--rpm"));
    $("#gSpeed").parentElement.classList.toggle("over", over);
    const banner=$("#alarm");
    if(over){
      $("#alarmText").textContent = `Equipamento acima da velocidade permitida (limite ${fmt(c.limSpeed)} km/h)`;
      banner.hidden=false;
    } else banner.hidden=true;
  }
  function drawAll(){ drawGauges(); drawLive(); }

  function loop(){ drawGauges(); drawLive(); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  // ---- First paint ----
  updateReadouts();
  const https = location.protocol==="https:";
  const hostIsIp = /^\d{1,3}(\.\d{1,3}){3}$/.test(location.hostname);
  if(!https && hostIsIp){
    $("#ip").value = location.hostname; $("#port").value = location.port || 80;
    conn = connectHttp(); afterConnect();
  }
  $("#srcNote").innerHTML = https
    ? "Você está vendo uma prévia (HTTPS). Para ler o ESP32 use o APK ou abra o dashboard servido pelo ESP32. Toque em <b>Simular</b> para experimentar a interface."
    : (hostIsIp ? "Conectado à origem do ESP32. Ajuste as escalas em ⚙ se precisar."
                : "Configure o IP do ESP32 em ⚙ e toque em Conectar.");
})();
</script>
